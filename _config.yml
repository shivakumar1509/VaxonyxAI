# _config.yml  — Default (GitHub Pages)
title: Vaxonyx
markdown: kramdown
theme: null
plugins:
  - jekyll-sitemap
permalink: pretty

# GitHub Pages project URL
url: "https://shivakumar1509.github.io"
baseurl: "/VaxonyxAI"

# Bump this whenever you change CSS/JS to clear browser cache
assets_version: "31"

# Default exclusions
exclude:
  - vendor
  - node_modules
  - Gemfile
  - Gemfile.lock
  - README.md
  - .github
  - amplify.yml
  - _config_aws.yml

# Sitemap exclusions for non-landing-page files
defaults:
  - scope:
      path: "assets/antigen.pdf"
    values:
      sitemap: false
  - scope:
      path: "assets/team/index.html"
    values:
      sitemap: false
  - scope:
      path: "promotion_index.html"
    values:
      sitemap: false
